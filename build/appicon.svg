<!--
  App-icon source. Mirrors frontend/src/components/Logo.tsx (the in-app
  brand mark) with its CSS custom-property colors (--color-accent,
  --color-accent-ink) baked in as literal hex - app icons are a single
  static image, so this uses the default/dark theme's values (#f2a93b /
  #1c1300), matching the mark as shown throughout the app's screenshots.
  If Logo.tsx's colors or shape ever change, update this file to match and
  re-render build/appicon.png from it (1024x1024 PNG, transparent
  background) - wails build regenerates build/windows/icon.ico and the
  macOS .icns from appicon.png automatically, and build.sh's Linux
  packaging (AppImage/.deb) copies appicon.png directly - nothing else
  needs to change.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 40 40">
  <defs>
    <clipPath id="disc">
      <circle cx="20" cy="20" r="19" />
    </clipPath>
  </defs>

  <circle cx="20" cy="20" r="19" fill="#f2a93b" />

  <g clip-path="url(#disc)">
    <circle cx="13" cy="11" r="12" fill="#ffffff" opacity="0.16" />
    <circle cx="29" cy="31" r="10" fill="#000000" opacity="0.1" />
  </g>

  <path d="M16 13 L16 27 L28 20 Z" fill="#1c1300" />
</svg>
